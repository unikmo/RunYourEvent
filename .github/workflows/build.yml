name: RunYourEvent Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SITE_URL: https://runyourevent.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-build-publishable-key
      ANTHROPIC_API_KEY: sk-ant-build-placeholder-not-used
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Community integration and access-control tests
        run: npm run test:input && npm run test:community && npm run test:seamless && npm run test:champsboard && npm run test:sponsor-hours
      - name: Production build
        run: npm run build

      - name: Search and AI discovery regression checks
        run: npm run test:discovery
