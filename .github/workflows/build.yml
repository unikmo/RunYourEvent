name: RunYourEvent Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SITE_URL: https://runyourevent.com
      NEXT_PUBLIC_SUPABASE_URL: https://phhpiqwvgwlgjmyiksqe.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Di0kT3dAcoP9dHlBrg-rHQ_ISw-26-9
      ANTHROPIC_API_KEY: sk-ant-build-placeholder-not-used
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
